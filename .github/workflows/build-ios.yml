name: Build iOS IPA (Unsigned)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'ios/**'
      - 'patch/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download GameData
        env:
          GH_TOKEN: ${{ secrets.DELTARUNE_DATA_TOKEN }}
        run: |
          set -e
          ASSET_ID=$(curl -s -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/locationovo/deltarune-data/releases/tags/v1" \
            | jq -r '.assets[0].id')
          echo "ASSET_ID=$ASSET_ID"
          [ "$ASSET_ID" != "null" ] && [ -n "$ASSET_ID" ] || { echo "asset not found"; exit 1; }

          curl -fL -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -o /tmp/gamedata.tar.gz \
            "https://api.github.com/repos/locationovo/deltarune-data/releases/assets/$ASSET_ID"

          rm -rf ios/Deltarune/GameData
          mkdir -p ios/Deltarune/GameData/games
          tar -xzf /tmp/gamedata.tar.gz -C ios/Deltarune/GameData/games/ --strip-components=1
          rm /tmp/gamedata.tar.gz

          echo "=== games/ contents ==="
          ls -la ios/Deltarune/GameData/games/ | head -30
          echo "=== ch0.win check ==="
          ls -la ios/Deltarune/GameData/games/ch0.win

      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Patch launcher
        run: |
          set -e
          curl -fL -o /tmp/utmt.zip \
            https://github.com/UnderminersTeam/UndertaleModTool/releases/download/0.9.2.0/UTMT_CLI_v0.9.2.0-Ubuntu.zip
          mkdir -p /tmp/utmt && unzip -q /tmp/utmt.zip -d /tmp/utmt
          chmod +x /tmp/utmt/UndertaleModCli

          SRC=ios/Deltarune/GameData/games/ch0.win
          [ -f "$SRC" ] || { echo "ch0.win missing"; ls -la ios/Deltarune/GameData/games/; exit 1; }

          cd /tmp/utmt
          dotnet /tmp/utmt/UndertaleModCli.dll load \
            "$GITHUB_WORKSPACE/$SRC" \
            -s "$GITHUB_WORKSPACE/patch/patch_launcher.csx" \
            -o /tmp/out.bin -f

          cp /tmp/out.bin "$GITHUB_WORKSPACE/ios/Deltarune/GameData/games/game.ios"
          rm -f "$GITHUB_WORKSPACE/$SRC"
          ls -la "$GITHUB_WORKSPACE/ios/Deltarune/GameData/games/" | head -30

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build .app
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild \
            -project "ios/Deltarune.xcodeproj" \
            -scheme "Deltarune" \
            -configuration "Release" \
            -sdk "iphoneos" \
            -destination "generic/platform=ios" \
            -derivedDataPath "build/derivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build/build.log
          APP=$(find build/derivedData/Build/Products/Release-iphoneos -name "Deltarune.app" -type d | head -1)
          [ -n "$APP" ] || { echo "build failed"; tail -50 build/build.log; exit 1; }

      - name: Locate .app
        id: locate
        run: |
          APP=$(find build/derivedData/Build/Products/Release-iphoneos -name "Deltarune.app" -type d | head -1)
          echo "app_path=$APP" >> "$GITHUB_OUTPUT"

      - name: Verify .app
        run: |
          APP="${{ steps.locate.outputs.app_path }}"
          echo "=== root ==="
          ls -la "$APP/" | head -20
          echo "=== games ==="
          ls -la "$APP/games/" | head -40

      - name: Package IPA
        run: |
          APP="${{ steps.locate.outputs.app_path }}"
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          cd build/ipa
          zip -r -q "Deltarune-unsigned.ipa" Payload/
          ls -la Deltarune-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Deltarune-unsigned-ipa
          path: build/ipa/Deltarune-unsigned.ipa
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/build.log
          retention-days: 7