name: Build iOS IPA (Unsigned)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download GameData from private release
        env:
          GH_TOKEN: ${{ secrets.DELTARUNE_DATA_TOKEN }}
        run: |
          set -e
          echo "Token length: ${#GH_TOKEN}"
          ASSET_ID=$(curl -s -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/locationovo/deltarune-data/releases/tags/v1" \
            | jq -r '.assets[0].id')
          echo "Asset ID: $ASSET_ID"
          [ "$ASSET_ID" != "null" ] && [ -n "$ASSET_ID" ] || { echo "Failed to get asset ID"; exit 1; }
          curl -fL -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -o /tmp/gamedata.tar.gz \
            "https://api.github.com/repos/locationovo/deltarune-data/releases/assets/$ASSET_ID"
          ls -la /tmp/gamedata.tar.gz
          mkdir -p ios/Deltarune/GameData/games
          tar -xzf /tmp/gamedata.tar.gz -C ios/Deltarune/GameData/games/
          rm /tmp/gamedata.tar.gz
          ls -la ios/Deltarune/GameData/games/

#      - name: Verify game data
#        run: |
#          cd ios/Deltarune/GameData/games
#          for f in game.ios gam1.droid gam2.droid gam3.droid \
#                   gam4.droid gam5.droid audiogroup1.dat; do
#            [ -f "$f" ] || { echo "MISSING: $f"; exit 1; }
#            echo "OK: $f ($(du -h "$f" | cut -f1))"
#          done
#          test -d lang && echo "OK: lang/"
#          test -d mus && echo "OK: mus/"
#          test -d vid && echo "OK: vid/"
#
      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Deltarune.app (unsigned)
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild \
            -project "ios/Deltarune.xcodeproj" \
            -scheme "Deltarune" \
            -configuration "Release" \
            -sdk "iphoneos" \
            -destination "generic/platform=ios" \
            -derivedDataPath "build/derivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            COMPRESS_PNG_FILES=NO \
            STRIP_PNG_TEXT=NO \
            build 2>&1 | tee build/build.log
          APP=$(find build/derivedData/Build/Products/Release-iphoneos -name "Deltarune.app" -type d | head -1)
          [ -n "$APP" ] || { echo "BUILD FAILED"; tail -50 build/build.log; exit 1; }

      - name: Locate built .app
        id: locate_app
        run: |
          APP=$(find build/derivedData/Build/Products/Release-iphoneos -name "Deltarune.app" -type d | head -1)
          echo "app_path=$APP" >> "$GITHUB_OUTPUT"

      - name: Verify .app contents
        run: |
          APP="${{ steps.locate_app.outputs.app_path }}"
          ls -la "$APP/" | head -30
          echo "=== .app/games ==="
          ls -la "$APP/games/" | head -30
          for f in game.ios gam1.droid gam5.droid audiogroup1.dat; do
            [ -f "$APP/games/$f" ] && echo "OK: games/$f" || echo "MISSING: games/$f"
          done
          du -sh "$APP/"

      - name: Package unsigned IPA
        run: |
          APP="${{ steps.locate_app.outputs.app_path }}"
          IPA_DIR="$(pwd)/build/ipa"
          rm -rf "$IPA_DIR"
          mkdir -p "$IPA_DIR/Payload"
          cp -R "$APP" "$IPA_DIR/Payload/"
          rm -rf "$IPA_DIR/Payload/Deltarune.app/PlugIns"
          rm -rf "$IPA_DIR/Payload/Deltarune.app/Frameworks/Deltarune Tests.xctest"
          cd "$IPA_DIR"
          zip -r -q "Deltarune-unsigned.ipa" Payload/
          ls -la "$IPA_DIR/Deltarune-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Deltarune-unsigned-ipa
          path: build/ipa/Deltarune-unsigned.ipa
          retention-days: 30
          compression-level: 0

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/build.log
            build/derivedData/Logs/
          retention-days: 7
          if-no-files-found: ignore